; ============================================================
; PlatformIO Project Configuration
; Target: AI Thinker ESP32-CAM (OV2640)
; Framework: Arduino
; Platform: espressif32
; ============================================================

[env:esp32cam]
platform  = espressif32
board     = esp32cam
framework = arduino

; -----------------------------------------------------------
; Serial / Upload Settings
; -----------------------------------------------------------
; CH340 USB-to-Serial adapter typical port on Linux.
; Change to match your actual device (check: ls /dev/ttyUSB*)
monitor_port  = /dev/ttyUSB0
upload_port   = /dev/ttyUSB0
monitor_speed = 115200
upload_speed  = 460800
monitor_rts   = 0
monitor_dtr   = 0

; -----------------------------------------------------------
; Flash & Partition Settings
; -----------------------------------------------------------
; "huge_app" gives the application the maximum available flash
; space (3 MB), which is required for the camera web server.
; The esp32cam board definition already selects 4 MB flash.
board_build.partitions = huge_app.csv

; -----------------------------------------------------------
; Build Flags
; -----------------------------------------------------------
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Select the AI Thinker pin map used in config.h
    -DCAMERA_MODEL_AI_THINKER
    ; Run CPU at 160 MHz instead of 240 MHz.
    ; Reduces heat with minimal impact on camera/Wi-Fi performance.
    -DARDUINO_RUNNING_CORE=1

; -----------------------------------------------------------
; Library Dependencies
; -----------------------------------------------------------
; The esp32-camera driver is bundled with the
; framework-arduinoespressif32 package (SDK component).
; No additional library entries are required for the camera.
; The WebServer library ships with the Arduino-ESP32 core.
